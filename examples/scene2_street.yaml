job:
  scene_prompt: "Sunny city street sidewalk lined with golden autumn trees and classic brick storefronts, golden hour lighting, clean urban pavement, soft pedestrians in far background, cinematic wide angle, 8k, photorealistic"
  negative_prompt: "blurry, low quality, deformed, extra limbs, ugly, bad anatomy, artifacts"
  resolution:
    width: 1024
    height: 1024
  model:
    repo_id: "black-forest-labs/FLUX.1-dev"
    dtype: "bfloat16"
    device: "cuda"
  sampler:
    steps: 20
    cfg: 3.5
    seed: 202

  characters:
    - id: "man_bearded"
      name: "Marcus (Bearded Man)"
      prompt: "handsome 32-year-old man, short neat dark brown hair, well-groomed full beard, sharp jawline, wearing a charcoal grey wool sweater and dark denim jeans, walking on the sidewalk with hands in pockets, smiling and looking sideways at his companion, natural walking posture"
      mask:
        type: "bbox"
        x: 120
        y: 160
        width: 350
        height: 720

    - id: "girl_auburn"
      name: "Elena (Auburn-haired Girl)"
      prompt: "stylish 26-year-old young woman, shoulder-length wavy auburn copper hair, green eyes, fair skin with light freckles, wearing a mustard yellow knitted cardigan over an ivory top and jeans, riding a vintage teal bicycle beside him on the sidewalk path, one hand on handlebars, looking at him cheerfully mid-conversation"
      mask:
        type: "bbox"
        x: 520
        y: 150
        width: 400
        height: 740

  inpaint:
    strength: 0.85
    mask_padding: 24
    mask_blur: 8
    mask_grow: 12

  output:
    path: "./output/scene2_street_final.png"
    save_intermediates: true
