job:
  scene_prompt: "Cozy modern European cafe interior with warm ambient morning sunlight, two people sitting across from each other at a round wooden cafe table having coffee, large window with gentle light, cafe counter and espresso machine in soft focus background, cinematic lighting, 8k, photorealistic"
  negative_prompt: "blurry, low quality, deformed, extra limbs, ugly, bad anatomy, artifacts, floating objects"
  resolution:
    width: 1024
    height: 1024
  model:
    repo_id: "black-forest-labs/FLUX.1-dev"
    dtype: "bfloat16"
    device: "cuda"
  sampler:
    steps: 22
    cfg: 3.5
    seed: 555

  characters:
    - id: "man_bearded"
      name: "Marcus (Bearded Man)"
      prompt: "handsome 32-year-old man with short neat dark brown hair and a well-groomed full beard, sharp jawline, wearing a charcoal grey wool sweater, sitting on the left side of the wooden cafe table holding a white ceramic coffee mug in both hands, taking a sip, relaxed natural posture"
      mask:
        type: "bbox"
        x: 60
        y: 160
        width: 440
        height: 720

    - id: "girl_auburn"
      name: "Elena (Auburn-haired Girl)"
      prompt: "stylish 26-year-old young woman with shoulder-length wavy auburn copper hair, green eyes, fair skin with light freckles, wearing a mustard yellow knitted cardigan over an ivory white top, sitting on the right side of the cafe table leaning forward, talking cheerfully with expressive hand gestures, smiling warmly"
      mask:
        type: "bbox"
        x: 520
        y: 140
        width: 450
        height: 740

  inpaint:
    strength: 0.88
    mask_padding: 24
    mask_blur: 10
    mask_grow: 16

  output:
    path: "./output/scene1_cafe_final.png"
    save_intermediates: true
