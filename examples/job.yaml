job:
  scene_prompt: "A futuristic neon-lit street in Neo-Tokyo, wet asphalt reflecting holographic advertisements, soft rain, cinematic lighting, 8k resolution"
  negative_prompt: "blurry, distorted, oversaturated, low quality, artifacts"
  resolution:
    width: 1024
    height: 1024
  model:
    repo_id: "black-forest-labs/FLUX.1-dev"
    dtype: "auto"
    device: "auto"
  sampler:
    steps: 30
    cfg: 3.5
    seed: 42

  characters:
    - id: "char_1"
      name: "Cyberpunk Runner"
      prompt: "young athletic woman wearing an iridescent techwear jacket with glowing collar, short neon blue hair, intense gaze"
      mask:
        type: "bbox"
        x: 120
        y: 180
        width: 320
        height: 540
      lora:
        path: "loras/cyber_runner.safetensors"
        strength: 0.85

    - id: "char_2"
      name: "Street Fixer"
      prompt: "middle-aged cyborg detective in dark trenchcoat, mechanical prosthetic eye glowing amber, cybernetic arm"
      mask:
        type: "bbox"
        x: 580
        y: 160
        width: 340
        height: 560

  inpaint:
    strength: 0.85
    mask_padding: 24
    mask_blur: 8
    mask_grow: 12

  output:
    path: "./output/cyberpunk_scene.png"
    save_intermediates: true
