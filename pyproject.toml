[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inpainter"
version = "0.1.0"
description = "N-pass multi-character inpainting pipeline using diffusers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "peft>=0.7.0",
]

[project.optional-dependencies]
sam = ["segment-anything>=1.0"]
controlnet = ["controlnet-aux>=0.0.9"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
inpainter = "cli.main:app"
inpainter-dryrun = "tools.dryrun:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "cli", "tools", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
